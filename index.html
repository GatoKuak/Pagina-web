<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi página con tablas</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4ff;
            text-align: center;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 80%;
            background: white;
        }
        th, td {
            border: 1px solid #555;
            padding: 12px;
        }
        th {
            background: #3459a5;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Mi primera página con tablas</h1>
    <h2>Horario de clases</h2>
    <table>
        <tr>
            <th>Día</th>
            <th>Materia</th>
            <th>Horario</th>
        </tr>
        <tr>
            <td>Lunes</td>
            <td>Programación</td>
            <td>08:00 - 10:00</td>
        </tr>
        <tr>
            <td>Martes</td>
            <td>Matemáticas</td>
            <td>10:00 - 12:00</td>
        </tr>
        <tr>
            <td>Miércoles</td>
            <td>Física</td>
            <td>08:00 - 10:00</td>
        </tr>
    </table>
</body>
</html>
